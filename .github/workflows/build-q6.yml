name: Build Q6 Ultra Auto Lock

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'q6-ultra-auto-lock-source.zip'
      - '.github/workflows/build-q6.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source
        run: |
          rm -rf src
          mkdir src
          unzip -q q6-ultra-auto-lock-source.zip -d src
          chmod +x src/zmk-openrgb-fork-openrgb/openrgb/build.sh

      - name: Build firmware
        working-directory: src/zmk-openrgb-fork-openrgb
        run: ./openrgb/build.sh keychron_q6_ultra_ansi

      - name: Show checksum
        working-directory: src/zmk-openrgb-fork-openrgb
        run: |
          ls -lh openrgb/output/keychron_q6_ultra_ansi.bin
          sha256sum openrgb/output/keychron_q6_ultra_ansi.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: q6-ultra-auto-lock-firmware
          path: src/zmk-openrgb-fork-openrgb/openrgb/output/keychron_q6_ultra_ansi.bin
          if-no-files-found: error
